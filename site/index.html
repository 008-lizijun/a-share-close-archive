<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="每日记录六只 A 股科技公司的收盘数据、2026 年机构一致预期，并支持按日期导出 XLSX。"
    />
    <meta name="theme-color" content="#f4f1ea" />
    <meta property="og:title" content="每日股价报告" />
    <meta
      property="og:description"
      content="A 股收盘数据、2026 年业绩预测与每日 XLSX 导出。"
    />
    <meta property="og:image" content="./og.png" />
    <title>每日股价报告</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"
      defer
    ></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main>
      <section class="report-header">
        <h1>每日股价报告</h1>
        <details class="stock-list">
          <summary>
            <span>收录股票</span>
            <strong>6 只</strong>
          </summary>
          <div class="stock-list-grid">
            <div><span>中际旭创</span><small>300308</small></div>
            <div><span>紫光股份</span><small>000938</small></div>
            <div><span>新易盛</span><small>300502</small></div>
            <div><span>澜起科技</span><small>688008</small></div>
            <div><span>工业富联</span><small>601138</small></div>
            <div><span>浪潮信息</span><small>000977</small></div>
          </div>
        </details>
      </section>

      <section class="records-section" aria-label="每日股价数据">
        <div id="records" class="daily-list" aria-live="polite">
          <div class="empty-records">正在读取每日股价数据</div>
        </div>
      </section>

      <p id="export-status" class="export-status" aria-live="polite"></p>
      <footer>数据与预测仅供信息参考，不构成投资建议。</footer>
    </main>
  </body>
</html>
