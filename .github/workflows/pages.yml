name: 更新 A 股收盘档案并发布

on:
  schedule:
    # 15:30 主更新；16:10 再运行一次，作为行情接口或 GitHub 调度延迟的兜底。
    - cron: "30 15 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "10 16 * * 1-5"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 读取仓库
        uses: actions/checkout@v6

      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: 检查北京时间当天记录
        id: daily_record
        shell: bash
        run: |
          beijing_date="$(TZ=Asia/Shanghai date +%F)"
          if node - "$beijing_date" <<'NODE'
          const fs = require("node:fs");
          const date = process.argv[2];
          const requiredCodes = ["300308", "000938", "300502", "688008", "601138", "000977"];
          const numericFields = ["price", "marketCap", "eps", "pe", "changePercent"];
          const records = JSON.parse(fs.readFileSync("site/data/records.json", "utf8"));
          const record = records.find((item) => item.date === date);
          const complete =
            record &&
            Array.isArray(record.stocks) &&
            record.stocks.length === requiredCodes.length &&
            new Set(record.stocks.map((stock) => stock.code)).size === requiredCodes.length &&
            requiredCodes.every((code) => record.stocks.some((stock) => stock.code === code)) &&
            record.stocks.every(
              (stock) =>
                stock.quoteTime?.startsWith(date) &&
                numericFields.every((field) => Number.isFinite(Number(stock[field]))),
            );
          process.exit(complete ? 0 : 1);
          NODE
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${beijing_date} 已有完整归档，跳过重复行情请求"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${beijing_date} 尚无完整归档，启动行情抓取"
          fi

      - name: 获取当天收盘数据
        if: steps.daily_record.outputs.exists != 'true'
        # 15:30 首次请求失败时先等待 16:10 兜底；兜底或手动运行失败才发送告警。
        continue-on-error: ${{ github.event_name == 'schedule' && github.event.schedule == '30 15 * * 1-5' }}
        shell: bash
        run: |
          for attempt in 1 2; do
            if node scripts/update-market-data.mjs; then
              exit 0
            fi
            if [[ "$attempt" -lt 2 ]]; then
              echo "第 ${attempt} 次获取失败，5 分钟后重试"
              sleep 300
            fi
          done
          exit 1

      - name: 保存交易日记录
        shell: bash
        run: |
          if git diff --quiet -- site/data/records.json; then
            echo "交易日数据无变化"
            exit 0
          fi
          beijing_date="$(TZ=Asia/Shanghai date +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/data/records.json
          git commit -m "data: archive ${beijing_date} A-share close"
          git pull --rebase origin main
          git push origin main

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 打包网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
